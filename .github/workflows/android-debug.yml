# Happy path is GitHub-only (no Zeus publish, no Hephaestus tag/webhook):
#
# pull_request → main (same repo, not draft): assemble, merge, then SemVer
#   tag/release. GITHUB_TOKEN merges do not start a push workflow, so the
#   PR job publishes after merge.
# push → main or workflow_dispatch on main: assemble, upload app-debug,
#   create vMAJOR.MINOR.PATCH from versionName when that tag is new.
#
# Pull-request artifacts are a 1-day handoff for the merge job. Push and
# dispatch keep app-debug for 2 days.
#
# Failures mail ops-alert. Empty SMTP secrets warn and skip; that skip does
# not fail the job.

name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 2 }}

      - name: Tag SemVer and publish GitHub Release
        id: semver
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish_semver.sh "${GITHUB_SHA}" app/build/outputs/apk/debug/app-debug.apk

      - name: Job summary
        if: success()
        env:
          TAG_CREATED: ${{ steps.semver.outputs.created }}
          TAG_NAME: ${{ steps.semver.outputs.tag }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_HUMAN=$(numfmt --to=iec --suffix=B "$SIZE_BYTES")
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          {
            echo "## Debug APK"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| Artifact | \`app-debug\` (1-day merge handoff) |"
            else
              echo "| Artifact | \`app-debug\` (retained 2 days) |"
            fi
            if [ "${TAG_CREATED}" = "true" ]; then
              echo "| Release | tagged and published \`${TAG_NAME}\` |"
            elif [ -n "${TAG_NAME}" ]; then
              echo "| Release | \`${TAG_NAME}\` already existed |"
            fi
            echo "| Path | \`$APK\` |"
            echo "| Size | ${SIZE_HUMAN} (${SIZE_BYTES} bytes) |"
            echo "| SHA-256 | \`${SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Merge on green
    needs: assemble-debug
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
        run: |
          set -euo pipefail
          CURRENT="$(gh pr view "$PR" --repo "$GH_REPO" --json headRefOid,isDraft,mergeable,state,mergeCommit --jq '{head:.headRefOid,draft:.isDraft,mergeable:.mergeable,state:.state,merge:.mergeCommit.oid}')"
          HEAD="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"])')"
          DRAFT="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["draft"])')"
          STATE="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
          MERGEABLE="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["mergeable"])')"
          EXISTING_MERGE="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("merge") or "")')"
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "MERGED" ]; then
            echo "PR #${PR} is already merged."
            echo "merge_sha=${EXISTING_MERGE}" >> "$GITHUB_OUTPUT"
            echo "did_merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = "True" ]; then
            echo "PR #${PR} is draft; skip merge."
            echo "did_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD" != "$TESTED_HEAD" ]; then
            echo "PR head moved (${HEAD} != ${TESTED_HEAD}); not merging a stale green."
            echo "did_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::PR #${PR} has conflicts."
            exit 1
          fi
          RESP="$(gh api --method PUT "repos/${GH_REPO}/pulls/${PR}/merge" \
            -f merge_method=merge \
            -f sha="${TESTED_HEAD}" \
            -f commit_title="Merge pull request #${PR} from ${HEAD_LABEL}")"
          MERGE_SHA="$(printf '%s' "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "Merged PR #${PR} at ${MERGE_SHA}."
          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "did_merge=true" >> "$GITHUB_OUTPUT"

      - name: Download debug APK
        if: steps.merge.outputs.did_merge == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Tag SemVer after GITHUB_TOKEN merge
        if: steps.merge.outputs.did_merge == 'true' && steps.merge.outputs.merge_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish_semver.sh "${{ steps.merge.outputs.merge_sha }}" apk/app-debug.apk

  alert-on-failure:
    name: Alert on failure
    needs: [assemble-debug, auto-merge]
    if: ${{ always() && (needs.assemble-debug.result == 'failure' || needs.auto-merge.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check ops-alert SMTP secrets
        id: ops-alert
        env:
          HAS_HOST: ${{ secrets.STALWART_SMTP_HOST != '' }}
          HAS_PORT: ${{ secrets.STALWART_SMTP_PORT != '' }}
          HAS_USER: ${{ secrets.STALWART_SMTP_USER != '' }}
          HAS_PASSWORD: ${{ secrets.STALWART_SMTP_PASSWORD != '' }}
          HAS_FROM: ${{ secrets.STALWART_SMTP_FROM != '' }}
          HAS_TO: ${{ secrets.OPS_ALERT_TO != '' }}
        run: |
          if [ "$HAS_HOST" = "true" ] && [ "$HAS_PORT" = "true" ] && [ "$HAS_USER" = "true" ] && [ "$HAS_PASSWORD" = "true" ] && [ "$HAS_FROM" = "true" ] && [ "$HAS_TO" = "true" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stalwart SMTP secrets are not set (STALWART_SMTP_HOST, STALWART_SMTP_PORT, STALWART_SMTP_USER, STALWART_SMTP_PASSWORD, STALWART_SMTP_FROM, OPS_ALERT_TO). Skipping failure mail."
          fi

      - name: Mail ops-alert on failure
        if: steps.ops-alert.outputs.send == 'true'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: ${{ secrets.STALWART_SMTP_HOST }}
          server_port: ${{ secrets.STALWART_SMTP_PORT }}
          secure: true
          username: ${{ secrets.STALWART_SMTP_USER }}
          password: ${{ secrets.STALWART_SMTP_PASSWORD }}
          from: ${{ secrets.STALWART_SMTP_FROM }}
          to: ${{ secrets.OPS_ALERT_TO }}
          subject: "[MermaidPocket CI] failed: ${{ github.event_name }} ${{ github.sha }}"
          body: |
            MermaidPocket CI failed.

            Event: ${{ github.event_name }}
            Branch: ${{ github.head_ref || github.ref_name }}
            SHA: ${{ github.sha }}
            Assemble: ${{ needs.assemble-debug.result }}
            Auto-merge: ${{ needs.auto-merge.result }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
